[project]
name = "obsidian-gate"
version = "0.1.0"
description = "A tool aimed at generating a wiki-like website from an Obsidian vault"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-session>=0.8.0",
    "flask-sqlalchemy>=3.1.1",
    "markdown-it-py[linkify,plugins]>=4.2.0",
    "psycopg>=3.3.4",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
]

[project.scripts]
gate = "obsidian_gate.cli:run"

[dependency-groups]
dev = [
    "ty>=0.0.58",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = ["obsidian_gate/migrations"]

[tool.ty.src]
exclude = ["obsidian_gate/migrations"]

[[tool.ty.overrides]]
include = ["obsidian_gate/models/*.py"]

[tool.ty.overrides.rules]
unsupported-base = "ignore"
